# Environment matrix (FIXES.md §6): six rows chosen by BACKEND PROVENANCE, not by OS.
# Nightly and on tags, because these build containers and are far from cheap.
#
# Every row declares what it expects to resolve. That is the assertion that makes the
# matrix meaningful: a Debian container with a pip numpy wheel resolves numpy's bundled
# scipy_openblas64 and tests nothing about Debian -- a green row proving nothing.
# tests/long/test_env_matrix.py turns each BIGLA_EXPECT_* below into a hard failure.
name: backends

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  row:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pip-numpy-wheel
            name: "manylinux, pip numpy wheel"
            base: python:3.12-slim
            blas: wheel
            notes: >-
              the common case: numpy's bundled ILP64 OpenBLAS, reached before any system library
            expect_path: 'numpy\.libs/libscipy_openblas64_'
            expect_decoration: scipy_NAME_64_
            expect_confidence: config-string
            expect_ilp64: "1"

          - id: scipy-openblas64-pkg
            name: "manylinux, scipy-openblas64 package"
            base: python:3.12-slim
            blas: scipy-openblas64
            notes: >-
              the documented escape hatch; resolves a different file from the wheel row, ahead of it
            # _candidates() reaches the standalone package BEFORE numpy.libs, so this row
            # resolves a genuinely different file from the row above.
            expect_path: 'scipy_openblas64/lib/'
            expect_decoration: scipy_NAME_64_
            expect_confidence: config-string
            expect_ilp64: "1"

          - id: debian-openblas64
            name: "Debian trixie, libopenblas64-dev"
            base: debian:trixie
            blas: debian
            notes: >-
              BARE decoration, so only openblas_get_config -> USE64BITINT distinguishes it from LP64; the pthread variant, which libopenblas64-dev chose, not us
            # ANSWERED, run 34345832317 (2026-09-09): bare `_`, not `_64_`. The row failed
            # its first execution with `assert 'NAME_' == 'NAME_64_'`, which was the question
            # being asked, and this line now records the answer rather than the guess.
            #
            # This makes Debian the matrix's most valuable row. Its library is ILP64 but its
            # symbols are indistinguishable from an LP64 build -- so `openblas_get_config` ->
            # USE64BITINT is the ONLY thing standing between discovery and a silently
            # wrong-width binding. expect_confidence below is what pins that, and no other row
            # exercises it (MKL validates through mkl_set_interface_layer instead).
            expect_path: '^/usr/lib/.*libopenblas64'
            expect_decoration: NAME_
            expect_confidence: config-string
            expect_ilp64: "1"

          - id: fedora-openblas64
            name: "Fedora 44, openblas-serial64_"
            base: fedora:44
            blas: fedora
            notes: >-
              distro numpy goes through FlexiBLAS while bigla binds OpenBLAS64 directly -- two pools by construction; serial build, so threads=1
            expect_path: '^/usr/lib.*openblas64'
            expect_decoration: NAME_64_
            expect_confidence: config-string
            expect_ilp64: "1"

          - id: conda-mkl
            name: "conda-forge, MKL"
            base: mambaorg/micromamba:latest
            blas: mkl
            notes: >-
              libmkl_rt is a dispatcher: it loads libmkl_intel_ilp64/core/thread globally itself, so MKL symbols are process-wide whatever mode we dlopen with
            # The only row that reaches the MKL_Set_Interface_Layer branch.
            #
            # NAME_64_, not the NAME_ guessed here originally. MKL's single dynamic library
            # exports `_64`-suffixed ILP64 entry points alongside the LP64 ones, and
            # _DECORATIONS tries ("", "_64_") before ("", "_"), so discovery binds
            # `dpotrf_64_`. First inferred from run 34349903390's leak-test message, then
            # CONFIRMED by this assertion in run 34354219949 -- the first run in which
            # tests/long executed on this row at all, `set -e` having stopped at the fast
            # suite every time before that.
            expect_path: 'libmkl_rt'
            expect_decoration: NAME_64_
            expect_confidence: mkl-interface
            expect_ilp64: "1"

          - id: no-ilp64
            name: "Debian trixie, no ILP64 present"
            base: debian:trixie
            blas: none
            notes: >-
              the refusal path: no ILP64 anywhere, so the error message is the deliverable
            # The refusal path. No expect_* assertions: the point is that loading RAISES,
            # with a message naming both escape hatches.
            expect_no_backend: "1"

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        # Same rule as Run row below: matrix values arrive through `env:`, never spliced into
        # the script. These particular values are constrained identifiers today, but the rule
        # is worth more than the exception, and tests/test_matrix_config.py enforces it.
        env:
          BASE_IMAGE: ${{ matrix.base }}
          BLAS_SOURCE: ${{ matrix.blas }}
          ROW_ID: ${{ matrix.id }}
        run: |
          docker build \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "BLAS_SOURCE=$BLAS_SOURCE" \
            -t "bigla-row:$ROW_ID" .

      - name: Run row
        # Matrix values reach the shell through `env:`, never by `${{ }}` interpolation into
        # the script. Interpolation splices the raw text in before bash parses it, so a value
        # containing an apostrophe ends the single-quoted argument: the notes added for
        # pip-numpy-wheel begin "the common case: numpy's bundled ILP64 OpenBLAS", and the
        # nightly died at `line 16: unexpected EOF while looking for matching \`''` -- a shell
        # syntax error, before docker was reached. `notes` is free-form prose written by a
        # human, so this recurs by construction; the env block is also what GitHub recommends
        # against script injection generally. `docker run -e NAME` (no `=value`) forwards the
        # variable from this environment, so nothing is quoted twice.
        env:
          BIGLA_ROW_ID: ${{ matrix.id }}
          BIGLA_ROW_NAME: ${{ matrix.name }}
          BIGLA_EXPECT_PATH_RE: ${{ matrix.expect_path }}
          BIGLA_EXPECT_DECORATION: ${{ matrix.expect_decoration }}
          BIGLA_EXPECT_CONFIDENCE: ${{ matrix.expect_confidence }}
          BIGLA_EXPECT_ILP64: ${{ matrix.expect_ilp64 }}
          BIGLA_EXPECT_NO_BACKEND: ${{ matrix.expect_no_backend }}
          BIGLA_ROW_NOTES: ${{ matrix.notes }}
        run: |
          # 0777: the container writes its diagnose JSON here through the bind mount below,
          # and not every row runs as root. mambaorg/micromamba runs as `mambauser`
          # (uid 57439), which cannot write a directory the runner user owns -- the MKL row
          # failed with "cannot create /out/conda-mkl.json: Permission denied" AFTER its whole
          # suite had passed. An ephemeral CI scratch directory is the right place to be
          # permissive; the alternative, forcing --user root, would change what the row tests.
          mkdir -p out && chmod 0777 out
          docker run --rm \
            -e BIGLA_ROW_ID \
            -e BIGLA_ROW_NAME \
            -e BIGLA_EXPECT_PATH_RE \
            -e BIGLA_EXPECT_DECORATION \
            -e BIGLA_EXPECT_CONFIDENCE \
            -e BIGLA_EXPECT_ILP64 \
            -e BIGLA_EXPECT_NO_BACKEND \
            -e BIGLA_ROW_NOTES \
            -v "$PWD/out:/out" \
            "bigla-row:$BIGLA_ROW_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: row-${{ matrix.id }}
          path: out/*.json

  collect:
    needs: row
    # Rows are allowed to fail (a distro that changed its decoration is news, not a
    # blocker), and the table should still be regenerated from whichever rows succeeded.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: rows
          pattern: row-*
          merge-multiple: true

      - name: Regenerate docs/backends.md
        run: |
          pip install numpy
          pip install -e .
          python tools/render_backends.py rows/
          git diff --stat -- docs/backends.md backends.json

      - uses: actions/upload-artifact@v4
        with:
          name: backends-table
          path: |
            backends.json
            docs/backends.md
